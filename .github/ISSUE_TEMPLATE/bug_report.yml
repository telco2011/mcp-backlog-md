name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! 🐛
        
        Please fill out this form to help us understand and reproduce the issue.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 📋 Prerequisites
      description: Please confirm these before submitting
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have read the [documentation](../README.md)
          required: true
        - label: I am using the latest version of the MCP server
          required: false

  - type: textarea
    id: bug-description
    attributes:
      label: 🐛 Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: ✅ Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what should have happened...
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: ❌ Actual Behavior
      description: What actually happened?
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: 🔄 Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Configure MCP client with...
        2. Call tool with parameters...
        3. See error...
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 🌍 Environment Information
      description: Please provide details about your environment
      placeholder: |
        - OS: [e.g., macOS 13.0, Ubuntu 20.04, Windows 11]
        - Node.js version: [e.g., 18.17.0]
        - MCP Server version: [e.g., 1.2.1]
        - MCP Client: [e.g., VS Code with MCP extension, Cline]
        - backlog.md CLI version: [e.g., 1.0.0]
      value: |
        - OS: 
        - Node.js version: 
        - MCP Server version: 
        - MCP Client: 
        - backlog.md CLI version: 
    validations:
      required: true

  - type: textarea
    id: error-logs
    attributes:
      label: 📋 Error Messages/Logs
      description: Include any error messages, stack traces, or log output
      placeholder: Paste error messages or logs here...
      render: shell

  - type: textarea
    id: mcp-tool-call
    attributes:
      label: 🔧 MCP Tool Call Details
      description: If applicable, provide the exact tool call that triggered the bug
      placeholder: |
        Tool name: createTask
        Parameters: {
          "title": "Test task",
          "projectPath": "/path/to/project"
        }
      render: json

  - type: textarea
    id: additional-context
    attributes:
      label: 📝 Additional Context
      description: Add any other context, screenshots, or information about the problem
      placeholder: Any additional information that might be helpful...

  - type: dropdown
    id: severity
    attributes:
      label: ⚡ Severity Level
      description: How severely does this bug impact your usage?
      options:
        - "🔴 Critical - Blocks core functionality"
        - "🟠 High - Significantly impacts usage"
        - "🟡 Medium - Moderate impact"
        - "🟢 Low - Minor inconvenience"
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 🤝 Contribution
      description: Would you be interested in contributing a fix?
      options:
        - label: I'd be willing to submit a PR to fix this issue
        - label: I'd like guidance on how to investigate this issue

  - type: markdown
    attributes:
      value: |
        ---
        
        ## 📚 Helpful Resources
        
        - [🚀 Developer Guide](../DEVELOPER_GUIDE.md)
        - [📚 API Documentation](../docs/API.md)
        - [🔍 Troubleshooting Guide](../DEVELOPER_GUIDE.md#-debugging--troubleshooting)
        - [💬 GitHub Discussions](../../discussions)
        
        Thank you for helping improve the MCP Backlog.md Server! 🙏