name: Quality Gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: |
          echo "🔍 Running quality gates..."

          # Run all checks
          npm run check-all
          npm run test:coverage

      - name: Validate coverage thresholds
        run: |
          # Check if coverage meets minimum requirements (70%)
          COVERAGE_FILE="coverage/coverage-summary.json"

          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "❌ Coverage file not found"
            exit 1
          fi

          # Extract coverage percentages
          STATEMENTS=$(jq -r '.total.statements.pct' $COVERAGE_FILE)
          BRANCHES=$(jq -r '.total.branches.pct' $COVERAGE_FILE)
          FUNCTIONS=$(jq -r '.total.functions.pct' $COVERAGE_FILE)
          LINES=$(jq -r '.total.lines.pct' $COVERAGE_FILE)

          echo "📊 Coverage Report:"
          echo "  Statements: ${STATEMENTS}%"
          echo "  Branches: ${BRANCHES}%"
          echo "  Functions: ${FUNCTIONS}%"
          echo "  Lines: ${LINES}%"

          # Check thresholds (70% minimum)
          THRESHOLD=70
          FAILED=false

          if (( $(echo "$STATEMENTS < $THRESHOLD" | bc -l) )); then
            echo "❌ Statement coverage below threshold: ${STATEMENTS}% < ${THRESHOLD}%"
            FAILED=true
          fi

          if (( $(echo "$BRANCHES < $THRESHOLD" | bc -l) )); then
            echo "❌ Branch coverage below threshold: ${BRANCHES}% < ${THRESHOLD}%"
            FAILED=true
          fi

          if (( $(echo "$FUNCTIONS < $THRESHOLD" | bc -l) )); then
            echo "❌ Function coverage below threshold: ${FUNCTIONS}% < ${THRESHOLD}%"
            FAILED=true
          fi

          if (( $(echo "$LINES < $THRESHOLD" | bc -l) )); then
            echo "❌ Line coverage below threshold: ${LINES}% < ${THRESHOLD}%"
            FAILED=true
          fi

          if [ "$FAILED" = true ]; then
            echo "💀 Quality gate failed: Coverage below ${THRESHOLD}%"
            exit 1
          else
            echo "✅ All coverage thresholds met!"
          fi

      - name: Check for zero test failures
        run: |
          # Ensure no test failures
          TEST_OUTPUT=$(npm run test:coverage 2>&1)

          if echo "$TEST_OUTPUT" | grep -q "Tests:.*failed"; then
            echo "❌ Tests are failing"
            echo "$TEST_OUTPUT"
            exit 1
          fi

          echo "✅ All tests passing"

      - name: Security audit
        run: |
          echo "🔒 Running security audit..."
          npm audit --audit-level moderate

      - name: Quality gate summary
        run: |
          echo "🎉 All quality gates passed!"
          echo "✅ Code formatting"
          echo "✅ Linting"
          echo "✅ Type checking"
          echo "✅ Build compilation"
          echo "✅ Test coverage (70%+)"
          echo "✅ Zero test failures"
          echo "✅ Security audit"
