name: PR Automation

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        base: main
        head: develop
        title: 'Auto PR: Merge develop into main'
        body: |
          🤖 **Automated Pull Request**
          
          This PR was automatically created after successful builds on the `develop` branch.
          
          ## Changes
          - Latest changes from `develop` branch ready for release
          
          ## Checklist
          - [x] All CI checks passed
          - [x] Code has been reviewed
          - [ ] Ready for release
          
          Please review and merge when ready for release.
        draft: false

  pr-checks:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run PR validation
      run: |
        npm run check-all
        npm test

    - name: Comment PR
      if: success()
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ All checks passed! This PR is ready for review.'
          })

    - name: Comment PR on failure
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '❌ Some checks failed. Please review the workflow logs and fix any issues.'
          })