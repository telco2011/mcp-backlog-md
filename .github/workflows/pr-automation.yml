name: PR Automation

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          head: develop
          title: 'Auto PR: Merge develop into main'
          body: |
            🤖 **Automated Pull Request**

            This PR was automatically created after successful builds on the `develop` branch.

            ## Changes
            - Latest changes from `develop` branch ready for release

            ## Checklist
            - [x] All CI checks passed
            - [x] Code has been reviewed
            - [ ] Ready for release

            Please review and merge when ready for release.
          draft: false

  pr-checks:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run PR validation
        run: |
          npm run check-all
          npm run test:coverage

      - name: Extract coverage stats
        id: coverage
        run: |
          # Extract coverage percentages from Jest output
          if [ -f coverage/coverage-summary.json ]; then
            STATEMENTS=$(jq -r '.total.statements.pct' coverage/coverage-summary.json)
            BRANCHES=$(jq -r '.total.branches.pct' coverage/coverage-summary.json)
            FUNCTIONS=$(jq -r '.total.functions.pct' coverage/coverage-summary.json)
            LINES=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          else
            STATEMENTS="N/A"
            BRANCHES="N/A"
            FUNCTIONS="N/A"
            LINES="N/A"
          fi

          echo "statements=${STATEMENTS}%" >> $GITHUB_OUTPUT
          echo "branches=${BRANCHES}%" >> $GITHUB_OUTPUT  
          echo "functions=${FUNCTIONS}%" >> $GITHUB_OUTPUT
          echo "lines=${LINES}%" >> $GITHUB_OUTPUT

      - name: Comment PR
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            const { statements, branches, functions, lines } = context.payload;
            const coverageTable = `
            ## 📊 Test Coverage Report

            | Metric | Coverage |
            |--------|----------|
            | Statements | ${{ steps.coverage.outputs.statements }} |
            | Branches | ${{ steps.coverage.outputs.branches }} |
            | Functions | ${{ steps.coverage.outputs.functions }} |
            | Lines | ${{ steps.coverage.outputs.lines }} |

            ✅ **All checks passed!** This PR is ready for review.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: coverageTable
            })

      - name: Comment PR on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const failureMessage = `
            ## ❌ PR Validation Failed

            Some checks failed during validation. Please check the following:

            - **Linting**: Run \`npm run lint\` to check for code style issues
            - **Type Checking**: Run \`npm run typecheck\` to verify TypeScript types
            - **Build**: Run \`npm run build\` to ensure the project compiles
            - **Tests**: Run \`npm run test:coverage\` to verify all tests pass

            💡 **Quick fix**: Run \`npm run check-all\` to execute all checks locally.

            View the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for detailed error information.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: failureMessage
            })
